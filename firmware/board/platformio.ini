; Deck Thing - firmware for the Waveshare ESP32-S3-Touch-LCD-4.3
; ESP-IDF 5.5 through PlatformIO (pioarduino platform). LVGL comes from ../third_party/lvgl.
;
; Build:   pio run
; Flash:   pio run -t upload        (USB-C port marked UART)
; Monitor: pio device monitor

[platformio]
default_envs = ws43

[env:ws43]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = espidf
; PlatformIO ignores CONFIG_PARTITION_TABLE_* from sdkconfig.defaults and would give the app only 1 MB
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
